name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs (strict)
        run: python -m mkdocs build --strict

      - name: Validate generated internal links and anchors
        run: python scripts/validate-links.py

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure GitHub Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          http_code=$(echo "$response" | tail -1)

          if [ "$http_code" = "404" ]; then
            echo "GitHub Pages n'est pas configuré ; tentative de création."
            create_response=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}' \
              "https://api.github.com/repos/${{ github.repository }}/pages")
            create_code=$(echo "$create_response" | tail -1)
            if [ "$create_code" != "201" ] && [ "$create_code" != "200" ]; then
              echo "Impossible d'activer GitHub Pages (HTTP $create_code)." >&2
              exit 1
            fi
          elif [ "$http_code" != "200" ] && [ "$http_code" != "204" ]; then
            echo "Erreur lors de la vérification GitHub Pages (HTTP $http_code)." >&2
            exit 1
          fi

      - name: Deploy generated documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m mkdocs gh-deploy --force

      - name: Remove CNAME from gh-pages if present
        run: |
          set -e
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-clean origin/gh-pages
          cd /tmp/gh-pages-clean
          if [ -f CNAME ]; then
            git rm CNAME
            git commit -m "chore: supprimer le fichier CNAME du domaine personnalisé"
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/gh-pages-clean

      - name: Clear custom Pages domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"cname":null}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          http_code=$(echo "$response" | tail -1)
          if [ "$http_code" != "200" ] && [ "$http_code" != "204" ]; then
            echo "Avertissement : impossible de supprimer le domaine personnalisé (HTTP $http_code)." >&2
          fi
