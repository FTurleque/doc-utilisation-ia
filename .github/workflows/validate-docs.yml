name: Validate MkDocs documentation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate chapter progression
        run: python scripts/sync-navigation.py
      - name: Validate Copilot appendix scope
        run: python scripts/validate-copilot-scope.py

      - name: Build MkDocs (strict)
        run: python -m mkdocs build --strict

      - name: Validate generated internal links and anchors
        run: python scripts/validate-links.py
